<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2D55"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>

    <linearGradient id="glyph" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF0F5"/>
    </linearGradient>

    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#30044A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#rim)"/>
  <rect x="2" y="2" width="1020" height="1020" rx="222" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4"/>

  <g filter="url(#shadow)">
    <g fill="#FFFFFF">
      <rect x="190" y="470" width="40" height="84" rx="20" opacity="0.35"/>
      <rect x="260" y="400" width="40" height="224" rx="20" opacity="0.55"/>
      <rect x="330" y="330" width="40" height="364" rx="20" opacity="0.75"/>

      <rect x="654" y="330" width="40" height="364" rx="20" opacity="0.75"/>
      <rect x="724" y="400" width="40" height="224" rx="20" opacity="0.55"/>
      <rect x="794" y="470" width="40" height="84" rx="20" opacity="0.35"/>
    </g>

    <!-- Perfectly continuous vector path for beamed note -->
    <path fill="url(#glyph)" fill-rule="evenodd" d="
      M 444 280 
      L 670 230 
      C 678 228 684 234 684 242 
      L 684 570 
      A 64 50 -20 1 1 564 570 
      A 64 50 -20 0 1 628 525 
      L 628 300 
      L 494 330 
      L 494 630 
      A 64 50 -20 1 1 374 630 
      A 64 50 -20 0 1 438 585 
      L 438 292 
      C 438 284 444 278 452 280 
      Z
    "/>
  </g>
</svg>
