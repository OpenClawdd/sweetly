appId: com.sweetly.overlay
productName: Sweetly
directories:
  output: dist
  buildResources: buildResources
files:
  - build/**/*
  - package.json
asar: true
mac:
  category: public.app-category.music
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: buildResources/icon.png
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSMicrophoneUsageDescription: "Sweetly captures the current track's audio to auto-align lyrics."
dmg:
  icon: buildResources/icon.png
  iconSize: 110
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
npmRebuild: false
