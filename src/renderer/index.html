<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.spikerko.org; font-src 'self' https://fonts.spikerko.org; connect-src 'self' https://open.spotify.com https://api.spotify.com https://api.spicylyrics.org https://lrclib.net https://lyrics-api.binimum.org https://lyrics-storage.binimum.org ws://localhost:*; img-src 'self' https://is1-ssl.mzstatic.com https://*.mzstatic.com data:" />
    <title>Sweetly</title>
    <link rel="stylesheet" href="https://fonts.spikerko.org/spicy-lyrics/source.css" />
    <link rel="stylesheet" href="https://fonts.spikerko.org/Vazirmatn/source.css" />
    <style>
      html, body, #root, #app {
        background: transparent !important;
        background-color: transparent !important;
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      body {
        color: #fff;
        font-family: "SpicyLyrics", "Vazirmatn", -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      @keyframes shimmer {
        0% { transform: scale(1.03); }
        50% { transform: scale(1.06); }
        100% { transform: scale(1.03); }
      }
      ::-webkit-scrollbar { display: none; }
      /* Scoped away from .mac-btn and the artwork overlay controls, which
         carry their own colours and transforms. */
      button:not(.mac-btn):not(.icon-btn):hover {
        background: rgba(255, 255, 255, 0.12);
        color: rgba(255, 255, 255, 0.8);
      }
      button:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.3); outline-offset: 2px; }
      /* Artwork-overlay controls keep their own colour/transform, so they only
         brighten on hover. */
      .icon-btn:hover { opacity: 1; filter: brightness(1.25) drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5)); }
      button:not(.mac-btn):not(.icon-btn):active { transform: scale(0.95); }

      /* ── Now-playing panel ──────────────────────────────────────────────
         These were fixed-pixel inline styles (320px artwork inside a 36%
         column), which overflowed and collided with the lyrics at the
         default 520x380 window size. */
      .now-playing {
        width: clamp(150px, 34%, 420px);
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(8px, 2vh, 24px);
        padding: 0 clamp(8px, 1.5vw, 24px);
        box-sizing: border-box;
        position: relative;
        z-index: 2;
        -webkit-app-region: no-drag;
      }
      .artwork {
        width: min(100%, 320px);
        aspect-ratio: 1 / 1;
        border-radius: 4px;
        background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
        border: 2px solid rgba(255, 255, 255, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        overflow: hidden;
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
        position: relative;
      }
      .progress-row {
        width: min(100%, 320px);
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      .song-title {
        font-size: clamp(15px, 1.4vw, 22px);
        font-weight: 700;
        color: #fff;
        text-align: center;
        max-width: 100%;
        overflow-wrap: break-word;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        -webkit-app-region: no-drag;
      }
      .song-artist {
        font-size: clamp(11px, 0.85vw, 13px);
        font-weight: 500;
        color: rgba(255, 255, 255, 0.4);
        text-align: center;
        max-width: 100%;
        overflow-wrap: break-word;
        -webkit-app-region: no-drag;
      }
      /* Compact window: the artwork panel costs more than it gives, so drop
         to a text-only strip and hand the space to the lyrics. */
      @media (max-height: 460px) {
        .now-playing { width: clamp(120px, 28%, 260px); gap: 6px; }
        .artwork { display: none; }
      }

      .lyric-line {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        padding: 6px 16px;
        margin: 4px -16px;
        border-radius: 14px;
        /* No opacity/filter transition here: the spring loop writes both every
           frame, and a CSS transition on top of that just adds lag and a
           second, competing easing curve. */
        will-change: opacity, filter;
        cursor: pointer;
        position: relative;
        width: 100%;
        /* Was a flat 580px, which forced two-line wraps on wide displays. */
        max-width: min(1100px, 100%);
        box-sizing: border-box;
        background: transparent !important;
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }
      .lyric-line.active, .lyric-line:hover {
        background: transparent !important;
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }

      .word, .dot {
        display: inline-block;
        position: relative;
        font-weight: 700;
        font-style: normal !important;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SpicyLyrics", sans-serif;
        line-height: 1.35;
        font-size: clamp(1.5rem, 2.6cqi, 2.8rem);
        letter-spacing: -0.015em;
        margin-right: 0.28em;
        margin-bottom: 0.15em;
        cursor: pointer;
        background: transparent !important;
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
        will-change: transform, opacity;
      }

      .word-base, .dot-base {
        color: rgba(255, 255, 255, 0.48);
        display: inline-block;
        pointer-events: none;
        font-style: normal !important;
        background: transparent !important;
        background-color: transparent !important;
      }
      .word.parenthetical-word .word-base {
        color: rgba(255, 255, 255, 0.35) !important;
      }

      .word-fill, .dot-fill {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        color: #ffffff;
        font-style: normal !important;
        background: transparent !important;
        background-color: transparent !important;
        /* Sung text stays white (Apple Music does the same); the album-art
           accent colours the bloom around it. --accent-color is set per word
           by the spring loop. */
        text-shadow:
          0 0 18px color-mix(in srgb, var(--accent-color, #ffffff) 70%, transparent),
          0 0 6px rgba(255, 255, 255, 0.45),
          0 2px 8px rgba(0, 0, 0, 0.5);
        clip-path: inset(0 calc(100% - var(--sweep, 0%)) 0 0);
        -webkit-clip-path: inset(0 calc(100% - var(--sweep, 0%)) 0 0);
        pointer-events: none;
        will-change: clip-path;
      }

      .dot-group {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.8em;
        width: 100%;
        padding: 12px 0;
      }

      /* Lyric-alignment progress banner */
      .align-banner {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 9px;
        background: rgba(20, 20, 24, 0.82);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: rgba(255, 255, 255, 0.92);
        font-size: 0.82rem;
        font-weight: 600;
        padding: 9px 18px;
        border-radius: 999px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
        z-index: 60;
        pointer-events: none;
        white-space: nowrap;
      }
      .align-banner.failed {
        background: rgba(70, 22, 22, 0.85);
        border-color: rgba(255, 120, 120, 0.35);
      }
      .align-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #ff453a;
        flex-shrink: 0;
        animation: recpulse 1.6s ease-in-out infinite;
      }
      @keyframes recpulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }

      /* Resume Sync Floating Button */
      .resume-sync-btn {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #ffffff;
        font-size: 0.85rem;
        font-weight: 600;
        padding: 8px 18px;
        border-radius: 20px;
        cursor: pointer;
        z-index: 30;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .resume-sync-btn:hover {
        background: rgba(255, 255, 255, 0.28) !important;
        transform: translateX(-50%) scale(1.04);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
      }

      /* Line Grouping for 1:1 Apple Music & SpicyLyrics Sub-lines */
      .lyric-line-group {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        width: 100%;
        margin-bottom: 24px;
      }

      /* Background vocals stack directly under their lead line, smaller and
         dimmer — the way Music.app renders an ad-lib.
         The size has to be applied to .word: those carry their own absolute
         clamp(), so a font-size on the line did nothing. Opacity is driven
         per-frame by the spring loop, not from here. */
      .lyric-line.background-vocal {
        font-style: normal !important;
        width: 100% !important;
        margin-top: 2px !important;
        margin-bottom: 0px !important;
        padding-left: 2px !important;
      }
      .lyric-line.background-vocal .word {
        font-size: clamp(1.05rem, 1.82cqi, 1.96rem);
      }
      .lyric-line.background-vocal .word-base {
        color: rgba(255, 255, 255, 0.4);
      }
      .lyric-line.opposite-aligned {
        justify-content: flex-end;
        text-align: right;
      }

      /* Song Credits Footer (1:1 SpicyLyrics) */
      .lyrics-footer {
        margin-top: 48px;
        padding-top: 24px;
        padding-bottom: 40px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .footer-writer {
        font-size: 1.15rem;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.9);
      }
      .footer-provider {
        font-size: 0.9rem;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.6);
      }
      .footer-community {
        font-size: 0.85rem;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.5);
      }

      /* macOS Traffic Light Buttons */
      .mac-traffic-lights {
        display: flex;
        align-items: center;
        gap: 8px;
        -webkit-app-region: no-drag;
      }
      .mac-btn {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        transition: opacity 0.15s;
      }
      .mac-close { background: #ff5f56; border: 0.5px solid #e0443e; }
      .mac-minimize { background: #ffbd2e; border: 0.5px solid #dea123; }
      .mac-expand { background: #27c93f; border: 0.5px solid #1aab29; }
      .mac-traffic-lights:hover .mac-btn { opacity: 0.85; }

      /* Settings Modal Drawer */
      .settings-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: fadeIn 0.2s ease-out;
      }
      .settings-modal {
        background: rgba(24, 24, 28, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 20px;
        width: 440px;
        max-width: 90vw;
        padding: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        color: #fff;
      }
      .settings-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .settings-title {
        font-size: 1.15rem;
        font-weight: 700;
      }
      .settings-input {
        width: 100%;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 10px;
        padding: 10px 14px;
        color: #fff;
        font-family: inherit;
        font-size: 0.9rem;
        box-sizing: border-box;
        margin-top: 6px;
        margin-bottom: 16px;
        outline: none;
      }
      .settings-input:focus {
        border-color: rgba(255, 255, 255, 0.4);
        background: rgba(255, 255, 255, 0.12);
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }

      /* The spring loop and the artwork float are gated in JS (useReducedMotion);
         this covers the purely declarative motion. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
        .word-fill, .dot-fill { will-change: auto; }
        .lyric-line { will-change: auto; filter: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./index.jsx"></script>
  </body>
</html>
