<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.spikerko.org; font-src 'self' https://fonts.spikerko.org; connect-src 'self' https://open.spotify.com https://api.spotify.com https://api.spicylyrics.org https://lrclib.net https://lyrics-api.binimum.org https://lyrics-storage.binimum.org ws://localhost:*; img-src 'self' https://is1-ssl.mzstatic.com https://*.mzstatic.com data:" />
    <title>Sweetly</title>
    <link rel="stylesheet" href="https://fonts.spikerko.org/spicy-lyrics/source.css" />
    <link rel="stylesheet" href="https://fonts.spikerko.org/Vazirmatn/source.css" />
    <style>
      html, body, #root, #app {
        background: transparent !important;
        background-color: transparent !important;
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      body {
        color: #fff;
        font-family: "SpicyLyrics", "Vazirmatn", -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      @keyframes shimmer {
        0% { transform: scale(1.03); }
        50% { transform: scale(1.06); }
        100% { transform: scale(1.03); }
      }
      ::-webkit-scrollbar { display: none; }
      button:hover { background: rgba(255, 255, 255, 0.12) !important; color: rgba(255, 255, 255, 0.8) !important; }
      button:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.3); outline-offset: 2px; }
      button:active { transform: scale(0.95); }

      .lyric-line {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        padding: 6px 16px;
        margin: 4px -16px;
        border-radius: 14px;
        transition: background 0.3s cubic-bezier(0.25, 1, 0.5, 1), transform 0.25s ease, opacity 0.25s ease;
        will-change: transform, opacity, filter;
        cursor: pointer;
        position: relative;
        width: 100%;
        max-width: 580px;
        box-sizing: border-box;
        background: transparent !important;
        background-color: transparent !important;
      }
      .lyric-line.active {
        background: rgba(255, 255, 255, 0.045) !important;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .lyric-line:hover {
        background: rgba(255, 255, 255, 0.06) !important;
      }

      .word, .dot {
        display: inline-block;
        position: relative;
        font-weight: 700;
        font-style: normal !important;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SpicyLyrics", sans-serif;
        line-height: 1.35;
        font-size: clamp(1.5rem, 2.6cqi, 2.8rem);
        letter-spacing: -0.015em;
        margin-right: 0.28em;
        margin-bottom: 0.15em;
        cursor: pointer;
        background: transparent !important;
        background-color: transparent !important;
        box-shadow: none !important;
        will-change: transform, opacity;
      }

      .word-base, .dot-base {
        color: rgba(255, 255, 255, 0.48);
        display: inline-block;
        pointer-events: none;
        font-style: normal !important;
        background: transparent !important;
        background-color: transparent !important;
      }

      .word-fill, .dot-fill {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        color: #ffffff !important;
        font-style: normal !important;
        background: transparent !important;
        background-color: transparent !important;
        text-shadow: 0 0 14px var(--accent-color, rgba(255, 255, 255, 0.85)), 0 0 28px var(--accent-color, rgba(255, 255, 255, 0.45));
        clip-path: inset(0 calc(100% - var(--sweep, 0%)) 0 0);
        -webkit-clip-path: inset(0 calc(100% - var(--sweep, 0%)) 0 0);
        pointer-events: none;
        will-change: clip-path, text-shadow;
      }

      .dot-group {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.8em;
        width: 100%;
        padding: 12px 0;
      }

      /* Resume Sync Floating Button */
      .resume-sync-btn {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #ffffff;
        font-size: 0.85rem;
        font-weight: 600;
        padding: 8px 18px;
        border-radius: 20px;
        cursor: pointer;
        z-index: 30;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .resume-sync-btn:hover {
        background: rgba(255, 255, 255, 0.28) !important;
        transform: translateX(-50%) scale(1.04);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
      }

      /* Background Vocal & Duet Styling */
      .lyric-line.background-vocal {
        font-style: normal !important;
        opacity: 0.75;
      }
      .lyric-line.opposite-aligned {
        justify-content: flex-end;
        text-align: right;
      }

      /* macOS Traffic Light Buttons */
      .mac-traffic-lights {
        display: flex;
        align-items: center;
        gap: 8px;
        -webkit-app-region: no-drag;
      }
      .mac-btn {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        transition: opacity 0.15s;
      }
      .mac-close { background: #ff5f56; border: 0.5px solid #e0443e; }
      .mac-minimize { background: #ffbd2e; border: 0.5px solid #dea123; }
      .mac-expand { background: #27c93f; border: 0.5px solid #1aab29; }
      .mac-traffic-lights:hover .mac-btn { opacity: 0.85; }

      /* Settings Modal Drawer */
      .settings-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: fadeIn 0.2s ease-out;
      }
      .settings-modal {
        background: rgba(24, 24, 28, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 20px;
        width: 440px;
        max-width: 90vw;
        padding: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        color: #fff;
      }
      .settings-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .settings-title {
        font-size: 1.15rem;
        font-weight: 700;
      }
      .settings-input {
        width: 100%;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 10px;
        padding: 10px 14px;
        color: #fff;
        font-family: inherit;
        font-size: 0.9rem;
        box-sizing: border-box;
        margin-top: 6px;
        margin-bottom: 16px;
        outline: none;
      }
      .settings-input:focus {
        border-color: rgba(255, 255, 255, 0.4);
        background: rgba(255, 255, 255, 0.12);
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./index.jsx"></script>
  </body>
</html>
